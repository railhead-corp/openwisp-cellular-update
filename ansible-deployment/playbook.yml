---
- hosts: openwisp2
  become: yes
  roles:
    - openwisp.openwisp2
  vars:
    # Hostname configuration
    postfix_myhostname: openwisp-server
    
    # OpenWISP configuration (customize as needed)
    openwisp2_network_topology: true
    openwisp2_firmware_upgrader: true
    
    # Custom modules for modem upgrader
    openwisp2_extra_django_apps:
      - openwisp_modem_upgrader
    
    # Database configuration (uses existing if already installed)
    openwisp2_database:
      engine: django.db.backends.postgresql
      name: openwisp2
      user: openwisp2
      host: localhost
