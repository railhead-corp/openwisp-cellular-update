---
- name: Fix timezone configuration
  hosts: openwisp2
  become: yes
  tasks:
    - name: Update timezone to Asia/Kolkata in settings
      lineinfile:
        path: /opt/openwisp2/openwisp2/settings.py
        regexp: '^TIME_ZONE\s*=\s*'
        line: "TIME_ZONE = 'Asia/Kolkata'"
        create: no
      register: timezone_updated

    - name: Restart OpenWISP services if timezone changed
      supervisorctl:
        name: "{{ item }}"
        state: restarted
      loop:
        - openwisp2
        - celery
        - celery_monitoring
        - celery_network
        - celerybeat
        - daphne:asgi0
      when: timezone_updated.changed
