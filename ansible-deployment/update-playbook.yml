---
# Playbook to update existing OpenWISP installation with modem upgrader changes
- hosts: openwisp2
  become: yes
  
  vars:
    openwisp_path: /opt/openwisp2
    temp_upload_path: /tmp/openwisp-update
  
  tasks:
    - name: Create temporary upload directory
      file:
        path: "{{ temp_upload_path }}"
        state: directory
        mode: '0755'
    
    - name: Upload modem upgrader module to temp directory
      copy:
        src: ../openwisp_modem_upgrader/
        dest: "{{ temp_upload_path }}/openwisp_modem_upgrader/"
        mode: '0755'
    
    - name: Copy modem upgrader from temp to OpenWISP directory
      shell: |
        cp -r {{ temp_upload_path }}/openwisp_modem_upgrader {{ openwisp_path }}/
      args:
        creates: "{{ openwisp_path }}/openwisp_modem_upgrader"
    
    - name: Update modem upgrader files
      shell: |
        rsync -av --delete {{ temp_upload_path }}/openwisp_modem_upgrader/ {{ openwisp_path }}/openwisp_modem_upgrader/
    
    - name: Add modem upgrader to INSTALLED_APPS
      lineinfile:
        path: "{{ openwisp_path }}/openwisp2/settings.py"
        insertafter: '^\s*"openwisp_notifications",'
        line: '    "openwisp_modem_upgrader",'
        state: present
    
    - name: Check if modem upgrader URLs are configured
      lineinfile:
        path: "{{ openwisp_path }}/openwisp2/urls.py"
        line: "    path('', include('openwisp_modem_upgrader.urls')),"
        state: present
        insertafter: 'urlpatterns = \['
    
    - name: Upload setup files
      copy:
        src: "../{{ item }}"
        dest: "{{ openwisp_path }}/{{ item }}"
        mode: '0644'
      loop:
        - setup.py
        - setup.cfg
        - pyproject.toml
        - MANIFEST.in
    
    - name: Set ownership
      file:
        path: "{{ openwisp_path }}"
        owner: www-data
        group: www-data
        recurse: yes
    
    # Note: OpenWISP is already installed via ansible-openwisp2 role
    # We're just deploying updated modules and installing new dependencies
    
    - name: Install modem upgrader dependencies
      pip:
        name:
          - django-private-storage>=3.1.0
          - zstandard>=0.22.0
          - jsonschema>=4.0.0
        virtualenv: "{{ openwisp_path }}/env"
        state: present
    
    - name: Run database migrations
      django_manage:
        command: migrate
        app_path: "{{ openwisp_path }}"
        virtualenv: "{{ openwisp_path }}/env"
      environment:
        DJANGO_SETTINGS_MODULE: openwisp2.settings
    
    - name: Collect static files
      django_manage:
        command: collectstatic
        app_path: "{{ openwisp_path }}"
        virtualenv: "{{ openwisp_path }}/env"
      environment:
        DJANGO_SETTINGS_MODULE: openwisp2.settings
    
    - name: Restart OpenWISP services via supervisor
      supervisorctl:
        name: "{{ item }}"
        state: restarted
      loop:
        - openwisp2
        - celery
        - celery_monitoring
        - celery_network
        - celerybeat
        - daphne:asgi0
    
    - name: Add Django file upload size settings for large modem firmware
      blockinfile:
        path: "{{ openwisp_path }}/openwisp2/settings.py"
        marker: "# {mark} ANSIBLE MANAGED - Large file upload settings"
        block: |
          # Allow uploads up to 300MB for modem firmware files
          DATA_UPLOAD_MAX_MEMORY_SIZE = 314572800  # 300MB in bytes
          FILE_UPLOAD_MAX_MEMORY_SIZE = 314572800  # 300MB in bytes
        insertafter: EOF
    
    - name: Update nginx upload size and timeout limits for modem firmware
      blockinfile:
        path: /etc/nginx/sites-available/openwisp.local
        marker: "    # {mark} ANSIBLE MANAGED - Large file upload settings"
        insertbefore: '^\s*location\s+/'
        block: |
              client_max_body_size 250M;
              client_body_timeout 300s;
              proxy_read_timeout 300s;
              proxy_connect_timeout 300s;
              proxy_send_timeout 300s;
    
    - name: Reload Nginx configuration
      systemd:
        name: nginx
        state: reloaded
    
    - name: Clean up temporary files
      file:
        path: "{{ temp_upload_path }}"
        state: absent
    
    - name: Display completion message
      debug:
        msg: |
          ========================================
          Deployment completed successfully!
          ========================================
          - Modem upgrader module installed
          - Database migrations applied
          - Static files collected
          - Services restarted
          
          Check service status:
            sudo systemctl status openwisp2
            sudo systemctl status celery
