        $(document).ready(function () {
            var note = '<div class="help" style="padding: 10px; margin: 5px 0; background-color: #ffc; border: 1px solid #dda;">' +
                '{% filter escapejs %}{% trans "Note: A modem firmware entry already exists for this device. Saving without changing the image will not trigger a new upgrade. To re-trigger an upgrade, select a different image or delete the existing entry and add a new one." %}{% endfilter %}' +
                '</div>';
            $('#devicemodemfirmware_set-group .inline-related:first').prepend(note);
        });
    })(django.jQuery);
</script>
{% endif %}
